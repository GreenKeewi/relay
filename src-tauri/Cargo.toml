[package]
name = "relay"
version = "0.1.0"
description = "Relay desktop shell"
authors = ["Relay"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls", "system-proxy"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["time"] }
url = "2"
